<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff1493">
<title>Starlyn Studio · Painel do Karlu</title>
<link rel="icon" href="assets/logo-olhos.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-bt" viewBox="0 0 24 24"><path d="m7 7 10 10-5 5V2l5 5L7 17"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m3 11 18-8-8 18-2-8z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 21V9m0 0-5 5m5-5 5 5M4 3h16"/></symbol>
    <symbol id="i-loop" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
  </defs>
</svg>

<header class="top">
  <img class="logo" src="assets/logo.png" alt="Starlyn Infinite">
  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="eyes" class="on"><svg class="ic"><use href="#i-eye"/></svg><span>Olhos</span></button>
    <button data-tab="react"><svg class="ic"><use href="#i-bolt"/></svg><span>Reações</span></button>
    <button data-tab="export"><svg class="ic"><use href="#i-down"/></svg><span>Exportar</span></button>
  </nav>
  <button class="bt" id="btTop"><svg class="ic"><use href="#i-bt"/></svg><span id="btTopTxt">Conectar</span></button>
</header>

<main class="app">
  <aside class="stage">
    <div class="screen"><canvas id="cv" width="480" height="480" aria-label="Simulação do display do Karlu"></canvas></div>
    <div class="stageBar">
      <button id="bBlink" class="ghost">Piscar</button>
      <button id="bGaze" class="ghost">Olhar</button>
    </div>
    <p class="hint" id="stageHint">Simulação do display GC9A01 (240×240). O que você mexe aparece aqui na hora.</p>
  </aside>

  <section class="panel" id="p-eyes"></section>
  <section class="panel" id="p-react" hidden></section>
  <section class="panel" id="p-export" hidden></section>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="export.js"></script>
<script src="app.js"></script>
</body>
</html>
